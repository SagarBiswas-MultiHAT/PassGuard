<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Left Facet Gradient: Electric Cyan to Vibrant Emerald -->
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Right Facet Gradient: Deep Cyber Blue to Emerald (3D depth) -->
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Outer Rim Glowing Border -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Drop Shadow for contrast on any tab color -->
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Inner Check Shadow -->
    <filter id="checkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0369a1" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#shieldShadow)">
    <!-- Right Half of Shield (Deeper 3D Shadow Facet) -->
    <path d="M 32 4 C 44 4, 56 8, 56 14 C 56 36, 46 51, 32 60 Z"
          fill="url(#shieldRight)"/>

    <!-- Left Half of Shield (Bright 3D Highlight Facet) -->
    <path d="M 32 4 C 20 4, 8 8, 8 14 C 8 36, 18 51, 32 60 Z"
          fill="url(#shieldLeft)"/>

    <!-- Outer Shield Rim Stroke -->
    <path d="M 32 4 C 44 4, 56 8, 56 14 C 56 36, 46 51, 32 60 C 18 51, 8 36, 8 14 C 8 8, 20 4, 32 4 Z"
          fill="none"
          stroke="url(#rimGrad)"
          stroke-width="2.2"
          stroke-linejoin="round"/>

    <!-- Center Ridge Highlight Line -->
    <line x1="32" y1="5" x2="32" y2="59"
          stroke="rgba(255, 255, 255, 0.35)"
          stroke-width="1.2"
          stroke-linecap="round"/>

    <!-- Bold, Clean, Pure White Cryptographic Checkmark -->
    <path d="M 21 32 L 28.5 39.5 L 43 23"
          fill="none"
          stroke="#ffffff"
          stroke-width="6.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#checkGlow)"/>
  </g>
</svg>
